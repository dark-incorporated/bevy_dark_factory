name: CI
# **Once a day, not on every push** (owner, 2026-10-29). Several loop workers push to `main` many times an hour,
# and a run per push queued behind itself and slowed every iteration; each pass already builds, lints and tests
# locally before it pushes. A red daily run is a bug the loops take first (`build-loop.md`, "Parallel workers").
on:
  schedule:
    # **Weekly, not daily** (#528, owner 2026-11-21). The daily re-tested a `main` that could not
    # have changed since the pre-push gate passed it, and it was killed by contention rather than by
    # a test: `56b79814` failed as a `schedule` run and succeeded as a `workflow_dispatch` on the
    # same tree and runner. Weekly keeps the dependency-and-host check without paying 17 minutes of
    # `big`'s RAM for a tree that provably cannot differ from the one the gate just ran.
    - cron: "0 9 * * 1"   # Mondays, 09:00 UTC, 04:00 in Texas
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  test:
    name: test (workspace)
    # **A self-hosted runner** (owner, 2026-11-04). Eight sibling repos already run here, the registry
    # allocates `dark-incorporated/bevy_dark_factory 1`, and big carries the toolchain, `cargo-nextest`, `Xvfb` and
    # `xvfb-run` the workspace test needs. big is shared and runs systemd-oomd, which has SIGKILLed a CI
    # container under memory pressure. **The job runs with the memory-safe limits of the local pre-push gate**
    # (2026-11-15): the daily run was killed mid "workspace tests (nextest)" (no step conclusion, so the runner or
    # oomd killed it); the cause is big's RAM, which cargo's one job per core and nextest's one test thread per
    # core (each test a Bevy app) outgrow while other agents use it. The pre-push gate runs this same suite with
    # these limits in about 12 minutes, so the job takes `CARGO_BUILD_JOBS` 3, `NEXTEST_TEST_THREADS` 2 and an
    # hour's `timeout-minutes`.
    runs-on: [self-hosted, big]
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: workspace tests (nextest)
        env:
          NEXTEST_TEST_THREADS: 2
        run: xvfb-run -a cargo nextest run --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: doctests (nextest does not run them)
        run: cargo test --workspace --doc 2>&1 | tee doc-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: |
            test-output.txt
            doc-output.txt
