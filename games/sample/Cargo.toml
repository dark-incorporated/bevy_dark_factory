[package]
name = "blueprint_sample_game"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A small playable game made of YAML and Rhai: its Rust is one line (GD-10)."
publish = false

[[bin]]
name = "sample"
path = "src/main.rs"

[dependencies]
bevy.workspace = true
bevy_blueprint = { path = "../../crates/bevy_blueprint" }

[features]
# The release build: reads only `baked/` (`dark_factory bake games/sample --out games/sample/baked`).
baked = ["bevy_blueprint/baked"]

[dev-dependencies]
blueprint_model = { path = "../../crates/blueprint_model" }
bevy_blueprint_rhai = { path = "../../crates/bevy_blueprint_rhai" }
serde_json.workspace = true
